# XcodeGen specification.
#
# The Xcode project file is generated from this rather than committed. A
# .pbxproj is a large machine-written blob that produces unreadable diffs and
# constant merge conflicts; this file says the same thing in fifty readable
# lines, and CI regenerates the project on every build.
#
#   brew install xcodegen && xcodegen generate && open BrowserDial.xcodeproj

name: BrowserDial
options:
  bundleIdPrefix: com.gruncode
  deploymentTarget:
    iOS: "16.0"        # UNNotificationServiceExtension and CryptoKit are older
                       # than this, but 16 keeps SwiftUI's navigation modern
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Filled in by whoever builds for a real device. Left empty so the project
    # generates and compiles in CI without an Apple account.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  BrowserDial:
    type: application
    platform: iOS
    sources:
      - path: BrowserDial
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruncode.browserdial
        INFOPLIST_FILE: BrowserDial/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrowserDial/BrowserDial.entitlements
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: NotificationService

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruncode.browserdial.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        GENERATE_INFOPLIST_FILE: false

  # Runs on the simulator in CI, which needs no signing identity and no device.
  # This is how the project is verified at all by an author with neither a Mac
  # nor an iPhone.
  BrowserDialTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BrowserDial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gruncode.browserdial.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  BrowserDial:
    build:
      targets:
        BrowserDial: all
        BrowserDialTests: [test]
    test:
      targets:
        - BrowserDialTests
